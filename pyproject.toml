[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evohpinn"
version = "0.2.0"
description = "Evolutionary architecture search for heterogeneous physics-informed neural networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
evohpinn = "evohpinn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
